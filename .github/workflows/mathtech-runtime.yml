# Narrow resume of the PostgreSQL blocker; reuses Check's service, Node and migration path.
# No main/PR trigger and no deployment. Push only when the runtime boundary changes.
name: MathTech PostgreSQL runtime
on:
  workflow_dispatch:
  push:
    branches: [prototype/mathtech-intel-v0]
    paths:
      - .github/workflows/mathtech-runtime.yml
      - tests/mathtech-runtime.test.ts
      - tests/setup.ts
      - database/migrations/**
      - packages/backend/**
      - apps/api/**
      - industry/prompts/**
      - package-lock.json
permissions:
  contents: read
jobs:
  mathtech-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mathtech_runtime_ci
          # Throwaway GitHub-hosted runner only; no persistent credentials or external DB.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/mathtech_runtime_ci
      SITE_URL: http://127.0.0.1:3000
      API_BASE_URL: http://127.0.0.1:3001
      COLLECT_ENABLED: "false"
      MODEL_CALLS_ENABLED: "false"
      JINA_BODY_FALLBACK: "false"
      FEISHU_CONTENT_PUSH_ENABLED: "false"
      FEISHU_INTERNAL_ENABLED: "false"
      FEISHU_LOGIN_ENABLED: "false"
      INDEXNOW_SUBMIT_ENABLED: "false"
      ALLOW_PRIVATE_NETWORK_FETCH: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # same pin as upstream Check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # same pin as upstream Check
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify empty PostgreSQL 17
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { sql, closeDb } from '@aihot/backend/db';
          try {
            const [r] = await sql`SELECT version(), current_setting('server_version_num')::int AS n, current_database() AS db`;
            assert.equal(Math.floor(r.n / 10000), 17);
            assert.equal(r.db, 'mathtech_runtime_ci');
            assert.equal((await sql`SELECT count(*) AS n FROM information_schema.tables WHERE table_schema = 'public'`)[0].n, 0);
            console.log(JSON.stringify({ POSTGRES_17_RUNTIME: 'PASS', DB_INIT: 'PASS', runtime: r }));
          } finally { await closeDb(); }
          JS
      - name: Bootstrap existing migrations
        run: node scripts/migrate.ts
      - name: Single mock pipeline smoke and identical replay
        run: node --test --test-concurrency=1 --test-timeout=45000 tests/mathtech-runtime.test.ts
