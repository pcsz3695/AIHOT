name: MathTech evidence and calibration readiness
on:
  push:
    branches: [prototype/mathtech-intel-v0]
    paths:
      - industry/mathtech-evidence.ts
      - industry/mathtech-policy.ts
      - industry/mathtech.gold.jsonl
      - industry/mathtech-calibration.ts
      - industry/mathtech-readiness.ts
      - scripts/eval-selection.ts
      - scripts/mathtech-*.ts
      - scripts/export-mathtech-decision.ts
      - tests/mathtech-evidence.test.ts
      - tests/mathtech-budget.test.ts
      - tests/mathtech-readiness.test.ts
      - tests/mathtech-calibration-runtime.test.ts
      - tests/mathtech-fixture-helper.ts
      - tests/mathtech.tsconfig.json
      - .github/workflows/mathtech-readiness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mathtech_calibration_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/mathtech_calibration_ci
      MODEL_CALLS_ENABLED: "false"
      COLLECT_ENABLED: "false"
      JINA_BODY_FALLBACK: "false"
      FEISHU_CONTENT_PUSH_ENABLED: "false"
      FEISHU_INTERNAL_ENABLED: "false"
      FEISHU_LOGIN_ENABLED: "false"
      INDEXNOW_SUBMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Select invalidated checks
        id: scope
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          const files = execFileSync('git', ['diff', '--name-only', 'HEAD^', 'HEAD'], { encoding: 'utf8' });
          const all = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch';
          const evidence = /mathtech-(evidence|policy|fixture-helper)|mathtech\.gold/.test(files);
          const budget = /mathtech-budget/.test(files);
          const readiness = /mathtech-readiness\.ts|mathtech-readiness\.test/.test(files);
          const runtime = evidence || budget || /mathtech-calibration|eval-selection|export-mathtech-decision/.test(files);
          const evaluator = /eval-selection|mathtech-calibration/.test(files);
          for (const [key, value] of Object.entries({ evidence, budget, readiness, runtime, evaluator, db: runtime || evaluator })) appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${all || value}\n`);
          JS
      - name: Evidence, budget and readiness boundaries
        env:
          EVIDENCE: ${{ steps.scope.outputs.evidence }}
          BUDGET: ${{ steps.scope.outputs.budget }}
          READINESS: ${{ steps.scope.outputs.readiness }}
        run: |
          tests=()
          if [ "$EVIDENCE" = true ]; then tests+=(tests/mathtech-evidence.test.ts); fi
          if [ "$BUDGET" = true ]; then tests+=(tests/mathtech-budget.test.ts); fi
          if [ "$READINESS" = true ]; then tests+=(tests/mathtech-readiness.test.ts); fi
          if [ ${#tests[@]} -gt 0 ]; then node --test "${tests[@]}"; fi
      - name: Typecheck changed scripts and adapter tests only
        run: node node_modules/typescript/bin/tsc -p tests/mathtech.tsconfig.json
      - name: Fresh SelectBench test database setup (not B1 revalidation)
        if: steps.scope.outputs.db == 'true'
        run: node scripts/migrate.ts
      - name: New SelectBench projection and receipt reuse
        if: steps.scope.outputs.runtime == 'true'
        run: node --test --test-concurrency=1 tests/mathtech-calibration-runtime.test.ts
      - name: Existing evaluator regression (invalidated by optional mode changes)
        if: steps.scope.outputs.evaluator == 'true'
        run: node --test --test-concurrency=1 tests/selection-eval-runtime.test.ts
