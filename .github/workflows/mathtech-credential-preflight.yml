name: MathTech calibration credential preflight
on:
  push:
    branches: [prototype/mathtech-intel-v0]
    paths: [.github/workflows/mathtech-credential-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check configured provider without network calls
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com/v1' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-flash' }}
        shell: python
        run: |
          import os, json, sys
          from urllib.parse import urlparse
          base = urlparse(os.environ["LLM_BASE_URL"])
          present = bool(os.environ.get("LLM_API_KEY", "").strip())
          valid = base.scheme == "https" and bool(base.hostname) and not base.username and not base.password and not base.query and not base.fragment
          result = {"secretPresent": present, "baseOrigin": base.hostname if valid else "INVALID", "model": os.environ["LLM_MODEL"], "httpsConfigurationValid": valid, "apiCalls": 0, "authenticationVerified": False}
          print(json.dumps(result))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("Configuration presence only; no API authentication or calibration executed.\n\n")
              out.write(json.dumps(result, indent=2))
          sys.exit(0 if present and valid else 2)
